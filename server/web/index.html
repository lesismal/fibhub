<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fibhub server</title>
<link rel="stylesheet" href="/static/base.css">
<script src="/static/theme.js"></script>
<script src="/static/i18n.js"></script>
</head>
<body>
<header><h1>fibhub server <span id="name"></span></h1><span id="meta"></span></header>
<main>
<section><h2>Pods</h2><div id="pods"></div></section>
<section><h2>Clients</h2><div id="clients"></div></section>
<section><h2>Tunnels<button class="h2btn" onclick="openFlow()">Details</button></h2><div id="tunnels"></div></section>
<section><h2>This web page</h2><div id="web"></div></section>
</main>
<dialog id="editor">
<h3 id="edTitle">Nodes</h3>
<table><thead><tr><th>Name</th><th>Address (host:port)</th><th>Description</th><th></th></tr></thead><tbody id="edRows"></tbody></table>
<p><button onclick="addRow({})">Add node</button></p>
<p style="text-align:right"><button onclick="editor.close()">Cancel</button> <button class="primary" onclick="saveNodes()">Save to pod</button></p>
</dialog>
<div id="msg"></div>
<script src="/static/base.js"></script>
<script src="/static/flow.js"></script>
<script>
let state={peers:[],tunnels:[]};
function render(){
 const st=state;$('name').textContent=st.name;
 $('web').innerHTML=st.web&&st.web.addr?table(['Address','User','Password',''],[`<tr><td>${esc(pageURL(st.web.addr))}</td>${loginCells('web',st.web.addr,st.web.auth)}</tr>`]):'<div class="empty">None</div>';
 $('meta').textContent=`v${st.version} · arpc ${st.addr}${st.arpcWs?' · arpc-ws '+st.arpcWs:''}${st.wsAddr?' · web-ws '+st.wsAddr:''}${st.bodyEncrypted?' · bodies encrypted':''} · up ${ago(st.started)}`;
 const pods=st.peers.filter(p=>p.info.type==='pod'),clients=st.peers.filter(p=>p.info.type==='client');
 $('pods').innerHTML=table(['ID','Name','Address','Host','Nodes','Tunnels','Since',''],pods.map(p=>`<tr><td>${p.id}</td><td>${esc(p.info.name)}</td><td>${esc(p.addr)}</td>
  <td>${esc(p.info.hostname)}<div class="muted">${esc(p.info.os)} ${esc(p.info.version)}</div></td>
  <td>${(p.info.nodes||[]).map(n=>`<div class="node">${esc(n.name)} → ${esc(n.addr)}${n.desc?` <span class="muted">${esc(n.desc)}</span>`:''}</div>`).join('')||'<span class="muted">none</span>'}</td>
  <td>${p.tunnels}</td><td>${ago(p.since)}</td>
  <td><button onclick="refresh(${p.id})">Query</button><button onclick="edit(${p.id})">Edit nodes</button><button class="danger" onclick="kick(${p.id})">Kick</button></td></tr>`));
 $('clients').innerHTML=table(['ID','Name','Address','Host','Info','Tunnels','Since',''],clients.map(p=>`<tr><td>${p.id}</td><td>${esc(p.info.name)}</td><td>${esc(p.addr)}</td>
  <td>${esc(p.info.hostname)}<div class="muted">${esc(p.info.os)} ${esc(p.info.version)}</div></td>
  <td>${Object.entries(p.info.meta||{}).map(([k,v])=>`<div class="node">${esc(k)}=${esc(v)}</div>`).join('')}</td>
  <td>${p.tunnels}</td><td>${ago(p.since)}</td><td><button class="danger" onclick="kick(${p.id})">Kick</button></td></tr>`));
 $('tunnels').innerHTML=table(['ID','Client','Pod','Node','Address','Up','Down','Age',''],st.tunnels.map(t=>`<tr><td>${t.id}</td><td>${esc(t.client)}</td><td>${esc(t.pod)}</td>
  <td>${esc(t.node)}</td><td>${esc(t.addr)}</td><td>${bytes(t.up)}</td><td>${bytes(t.down)}</td><td>${ago(t.created)}</td>
  <td><button onclick="openFlow(${js(t.id)})">Details</button><button class="danger" onclick="closeTunnel('${t.id}')">Close</button></td></tr>`));
 flowRefresh();
}
// The tunnel diagrams: clients, this server, pods and their nodes.
const peerOf=(type,name)=>state.peers.find(p=>p.info.type===type&&p.info.name===name);
const peerFacts=p=>p?[['Address',p.addr],['Host',p.info.hostname],['OS',p.info.os],['Version',p.info.version],['Peer ID',p.id],['Since',ago(p.since)]]:[];
const tunnelOf=t=>({id:t.id,name:`${t.client} → ${t.pod}/${t.node}`,up:t.up,down:t.down,created:t.created});
function flowMe(g,col){const st=state;return g.node('me',col,{kind:'server',label:st.name,sub:st.addr,self:true,state:'ok',
 facts:[['Address',st.addr],['arpc over WebSocket',st.arpcWs||''],['Web page over WebSocket',st.wsAddr||''],['Body encryption',st.bodyEncrypted?'AES-256-GCM':'none'],['Version',st.version],['Uptime',ago(st.started)]]})}
function flowPeer(g,type,col,name){const p=peerOf(type,name);
 return g.node((type==='pod'?'p:':'c:')+name,col,{kind:type,label:name,sub:p?p.info.hostname||p.addr:'',state:p?'ok':'wait',facts:peerFacts(p)})}
function flowNode(g,col,pod,name){const p=peerOf('pod',pod),n=p&&(p.info.nodes||[]).find(n=>n.name===name)||{name};
 return g.node(`n:${pod}/${name}`,col,{kind:'node',icon:flowNodeIcon(name),label:name,sub:n.addr||'',facts:[['Pod',pod],['Address',n.addr],['Description',n.desc]]})}
function flowAll(){const st=state,g=flowGraph(['Clients','Server','Pods','Nodes']);flowMe(g,1);
 st.peers.forEach(p=>{if(p.info.type==='client'){flowPeer(g,'client',0,p.info.name);g.link('c:'+p.info.name,'me')}});
 st.peers.forEach(p=>{if(p.info.type!=='pod')return;flowPeer(g,'pod',2,p.info.name);g.link('me','p:'+p.info.name);
  (p.info.nodes||[]).forEach(n=>{flowNode(g,3,p.info.name,n.name);g.link('p:'+p.info.name,`n:${p.info.name}/${n.name}`)})});
 st.tunnels.forEach(t=>{flowPeer(g,'client',0,t.client);flowPeer(g,'pod',2,t.pod);flowNode(g,3,t.pod,t.node);
  g.tunnel(tunnelOf(t),['c:'+t.client,'me','p:'+t.pod,`n:${t.pod}/${t.node}`])});
 return g}
function flowOne(id){const st=state,t=st.tunnels.find(t=>t.id===id);if(!t)return null;
 const g=flowGraph(['Local app','Client','Server','Pod','Node']),enc=st.bodyEncrypted;
 g.node('app',0,{kind:'app',label:'Local app',sub:'not visible here',unknown:true,note:'Only the client sees the local app.'});
 flowPeer(g,'client',1,t.client);flowMe(g,2);flowPeer(g,'pod',3,t.pod);flowNode(g,4,t.pod,t.node);
 g.tunnel(tunnelOf(t),['app','c:'+t.client,'me','p:'+t.pod,`n:${t.pod}/${t.node}`],[{label:'TCP'},{label:'arpc',lock:enc},{label:'arpc',lock:enc},{label:'TCP'}]);
 return g}
async function load(){try{state=await api('/api/status');render()}catch(e){toast(e.message,true)}}
async function refresh(id){try{await api(`/api/peers/${id}/refresh`,{});toast('Pod queried');load()}catch(e){toast(e.message,true)}}
async function kick(id){if(!confirm('Kick this peer?'))return;try{await api(`/api/peers/${id}/kick`,{});toast('Kicked');setTimeout(load,300)}catch(e){toast(e.message,true)}}
async function closeTunnel(id){try{await api(`/api/tunnels/${id}/close`,{});toast('Tunnel closed');load()}catch(e){toast(e.message,true)}}
let editing=0;
function addRow(n){nodeRow($('edRows'),n)}
function edit(id){const p=state.peers.find(p=>p.id===id);if(!p)return;editing=id;$('edTitle').textContent='Nodes of pod '+p.info.name;$('edRows').innerHTML='';(p.info.nodes||[]).forEach(addRow);if(!(p.info.nodes||[]).length)addRow();editor.showModal()}
async function saveNodes(){const nodes=readNodes($('edRows'));
 try{await api(`/api/peers/${editing}/nodes`,nodes);editor.close();toast('Nodes saved on the pod');load()}catch(e){toast(e.message,true)}}
load();setInterval(()=>{if(!editor.open)load()},3000);
</script>
</body>
</html>
