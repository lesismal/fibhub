<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fibhub client</title>
<link rel="stylesheet" href="/static/base.css">
<script src="/static/theme.js"></script>
<script src="/static/workbench.js"></script>
<script src="/static/i18n.js"></script>
</head>
<body>
<header><h1>fibhub client <span id="name"></span></h1><span id="meta"></span></header>
<main>
<section data-view="servers" data-icon="server"><h2>Servers</h2><div id="servers"></div>
<form class="inline" onsubmit="addServer(event)">
<input id="sName" placeholder="name (optional)"><input id="sAddr" placeholder="host:7000 or ws://host:7001/fibhub" required><input id="sPass" type="password" placeholder="password" required><input id="sBody" type="password" placeholder="body AES password (optional)">
<button class="primary">Connect</button></form></section>
<section data-view="pods" data-icon="pod"><h2>Pods and nodes</h2><div id="pods"></div></section>
<section data-view="forwards" data-icon="forward"><h2>Forwards</h2><div id="forwards"></div>
<form class="inline" onsubmit="addForward(event)">
<input id="fListen" placeholder="local address, 127.0.0.1:2222" required><input id="fPod" placeholder="pod" required><input id="fNode" placeholder="node" required>
<input id="fServer" placeholder="server (optional: any)"><input id="fWeb" type="password" placeholder="web page user:password (optional)"><button class="primary">Forward</button></form></section>
<section data-view="tunnels" data-icon="tunnel"><h2>Tunnels<button class="h2btn" onclick="openFlow()">Details</button></h2><div id="tunnels"></div></section>
<section data-view="info" data-icon="info"><h2>Client info</h2>
<form class="inline" onsubmit="saveMeta(event)"><input id="metaText" placeholder="key=value, key2=value2 — told to servers"><button class="primary">Update servers</button></form></section>
</main>
<dialog id="editor">
<h3 id="edTitle">Nodes</h3>
<table><thead><tr><th>Name</th><th>Address (host:port)</th><th>Description</th><th></th></tr></thead><tbody id="edRows"></tbody></table>
<p><button onclick="nodeRow($('edRows'))">Add node</button></p>
<p style="text-align:right"><button onclick="editor.close()">Cancel</button> <button class="primary" onclick="saveNodes()">Save to pod</button></p>
</dialog>
<dialog id="loginEd"><form method="dialog" onsubmit="saveLogin(event)">
<h3 id="lgTitle">Login</h3>
<p><input id="lgUser" placeholder="user" autocomplete="off"></p><p><input id="lgPass" type="password" placeholder="password" autocomplete="new-password"></p>
<p class="muted">Empty user and password: the page has no login.</p>
<p style="text-align:right"><button type="button" onclick="loginEd.close()">Cancel</button> <button class="primary">Save</button></p></form></dialog>
<div id="msg"></div>
<script src="/static/base.js"></script>
<script src="/static/flow.js"></script>
<script>
let state={servers:[],forwards:[],webProxies:[],tunnels:[]},metaLoaded=false,editing=null;
function render(){
 const st=state;$('name').textContent=st.name;$('meta').textContent=`v${st.version}${st.saved?'':' · settings not saved (no -config)'}`;
 if(!metaLoaded){$('metaText').value=Object.entries(st.meta||{}).map(([k,v])=>k+'='+v).join(', ');metaLoaded=true}
 // Each server's row has its web page, through its web proxy; a web proxy
 // that is no server's gets a row of its own.
 const lone=st.webProxies.filter(w=>!st.servers.some(s=>proxyOf(s)===w));
 const cards=st.servers.map(s=>serverCard(s.name,s.addr,stateCell(s),[['Server',s.server],['Peer ID',s.peerId||''],['Pods',s.pods.length],['Tunnels',s.tunnels],
   ['Body encryption',s.bodyEncrypted?'AES-256-GCM':'none']],proxyOf(s),`<button onclick="refreshPods(${js(s.name)})">Query pods</button><button class="danger" onclick="delServer(${js(s.name)})">Remove</button>`))
  .concat(lone.map(w=>serverCard(w.name||w.url,'','<span class="muted">web proxy only</span>',[],w,'')));
 $('servers').innerHTML=cards.length?`<div class="cards">${cards.join('')}</div>`:'<div class="empty">None</div>';
 const rows=[];st.servers.forEach(s=>s.pods.forEach(p=>rows.push(`<tr><td>${esc(s.name)}</td><td>${esc(p.info.name)}<div class="muted">${esc(p.info.hostname)} ${esc(p.addr)}</div></td>
  <td>${(p.info.nodes||[]).map(n=>`<div class="node">${esc(n.name)} → ${esc(n.addr)}${n.desc?` <span class="muted">${esc(n.desc)}</span>`:''}
   <button onclick="useNode(${js(s.name)},${js(p.info.name)},${js(n.name)})">Forward…</button></div>`).join('')||'<span class="muted">none</span>'}</td>
  <td><button onclick="edit(${js(s.name)},${js(p.info.name)})">Edit nodes</button></td></tr>`)));
 $('pods').innerHTML=table(['Server','Pod','Nodes',''],rows);
 $('forwards').innerHTML=table(['Listen','Pod','Node','Server','State','Web user','Web password','',''],st.forwards.map(f=>`<tr><td>${esc(f.addr||f.listen)}</td><td>${esc(f.pod)}</td><td>${esc(f.node)}</td>
  <td>${esc(f.server||'any')}</td><td>${f.error?`<span class="state-failed">${esc(f.error)}</span>`:'<span class="state-registered">listening</span>'}</td>
  ${f.webAuth&&!f.error?loginCells('fw:'+f.listen,f.addr||f.listen,f.webAuth):'<td></td><td></td><td></td>'}
  <td><button onclick="editLogin(${js(f.listen)},${js(f.webAuth||'')},'web page of '+${js(f.pod+'/'+f.node)})">Set login</button><button class="danger" onclick="delForward(${js(f.listen)})">Remove</button></td></tr>`));
 $('tunnels').innerHTML=table(['Server','ID','Listen','Pod','Node','Address','Local client','Sent','Received','Age',''],st.tunnels.map(t=>`<tr><td>${esc(t.server)}</td><td>${t.id}</td><td>${esc(t.peer)}</td>
  <td>${esc(t.pod)}</td><td>${esc(t.node)}</td><td>${esc(t.addr)}</td><td>${esc(t.remote)}</td><td>${bytes(t.out)}</td><td>${bytes(t.in)}</td><td>${ago(t.created)}</td>
  <td><button onclick="openFlow(${js(t.id)})">Details</button><button class="danger" onclick="closeTunnel(${js(t.server)},${js(t.id)})">Close</button></td></tr>`));
 wbBadge('servers',st.servers.length);wbBadge('pods',rows.length);wbBadge('forwards',st.forwards.length);wbBadge('tunnels',st.tunnels.length);
 flowRefresh();
}
// The tunnel diagrams: this client, its forwards, servers, pods and their
// nodes. A client's tunnel end sends the local app's bytes (out) up.
const tunnelOf=t=>({id:t.id,name:`${t.peer} → ${t.pod}/${t.node}`,up:t.out,down:t.in,created:t.created});
const transport=a=>/^ws:/i.test(a)?'arpc over WebSocket':'arpc over TCP';
function flowMe(g,col){const st=state;return g.node('me',col,{kind:'client',label:st.name,sub:`${st.forwards.length} forwards`,self:true,state:'ok',
 facts:[['Servers',st.servers.length],['Forwards',st.forwards.length],['Version',st.version]]})}
function flowForward(g,col,listen){const f=state.forwards.find(f=>f.listen===listen)||{listen};
 return g.node('f:'+listen,col,{kind:'forward',label:f.addr||listen,sub:f.pod?`→ ${f.pod}/${f.node}`:'',state:f.error?'bad':'ok',
  facts:[['Listen',f.addr||listen],['Pod',f.pod],['Node',f.node],['Server',f.server||'any'],['State',f.error||'listening']]})}
function flowServer(g,col,name){const s=state.servers.find(s=>s.name===name);
 return g.node('s:'+name,col,{kind:'server',label:name,sub:s?s.addr:'',state:s?flowState(s.state):'wait',
  facts:s?[['Address',s.addr],['State',s.error||s.state],['Protocol',transport(s.addr)],['Body encryption',s.bodyEncrypted?'AES-256-GCM':'none'],['Peer ID',s.peerId||''],['Tunnels',s.tunnels]]:[]})}
function podOf(name){for(const s of state.servers)for(const p of s.pods)if(p.info.name===name)return p}
function flowPod(g,col,name){const p=podOf(name);
 return g.node('p:'+name,col,{kind:'pod',label:name,sub:p?p.info.hostname:'',state:p?'ok':'wait',
  facts:p?[['Address',p.addr],['Host',p.info.hostname],['OS',p.info.os],['Version',p.info.version],['Since',ago(p.since)]]:[]})}
function flowNode(g,col,pod,name){const p=podOf(pod),n=p&&(p.info.nodes||[]).find(n=>n.name===name)||{name};
 return g.node(`n:${pod}/${name}`,col,{kind:'node',icon:flowNodeIcon(name),label:name,sub:n.addr||'',facts:[['Pod',pod],['Address',n.addr],['Description',n.desc]]})}
function flowAll(){const st=state,g=flowGraph(['Client','Forwards','Servers','Pods','Nodes']);flowMe(g,0);
 st.forwards.forEach(f=>{flowForward(g,1,f.listen);g.link('me','f:'+f.listen)});
 st.servers.forEach(s=>{flowServer(g,2,s.name);s.pods.forEach(p=>{flowPod(g,3,p.info.name);g.link('s:'+s.name,'p:'+p.info.name);
  (p.info.nodes||[]).forEach(n=>{flowNode(g,4,p.info.name,n.name);g.link('p:'+p.info.name,`n:${p.info.name}/${n.name}`)})})});
 // A forward may take any server that has its pod.
 st.forwards.forEach(f=>st.servers.forEach(s=>{if((!f.server||f.server===s.name)&&s.pods.some(p=>p.info.name===f.pod))g.link('f:'+f.listen,'s:'+s.name)}));
 st.tunnels.forEach(t=>{flowForward(g,1,t.peer);flowServer(g,2,t.server);flowPod(g,3,t.pod);flowNode(g,4,t.pod,t.node);
  g.tunnel(tunnelOf(t),['me','f:'+t.peer,'s:'+t.server,'p:'+t.pod,`n:${t.pod}/${t.node}`])});
 return g}
function flowOne(id){const st=state,t=st.tunnels.find(t=>t.id===id);if(!t)return null;
 const g=flowGraph(['Local app','Client','Server','Pod','Node']),s=st.servers.find(s=>s.name===t.server)||{},enc=s.bodyEncrypted;
 g.node('app',0,{kind:'app',label:'Local app',sub:t.remote,state:'ok',facts:[['Address',t.remote]]});
 flowMe(g,1).facts.unshift(['Listen',t.local||t.peer]);g.byId.me.sub=t.local||t.peer;
 flowServer(g,2,t.server);flowPod(g,3,t.pod);flowNode(g,4,t.pod,t.node);
 g.tunnel(tunnelOf(t),['app','me','s:'+t.server,'p:'+t.pod,`n:${t.pod}/${t.node}`],[{label:'TCP'},{label:transport(s.addr||''),lock:enc},{label:'arpc',lock:enc},{label:'TCP'}]);
 return g}
// hostOf is the host of a server or web proxy address, host:port or a URL.
const hostOf=a=>{try{return new URL(String(a).includes('://')?a:'tcp://'+a).hostname}catch(e){return ''}};
// proxyOf is the web proxy that serves server s's web page: the one named
// after s, or else the one whose URL is on s's host.
function proxyOf(s){const ws=state.webProxies||[];return ws.find(w=>w.name===s.name)||ws.find(w=>!w.name&&hostOf(w.url)&&hostOf(w.url)===hostOf(s.addr))}
// serverCard is a server's card: its name, address and state, facts, the
// management page that web proxy w serves (address, login, Open, Set login)
// and the server's buttons.
function serverCard(name,addr,state,facts,w,buttons){const dl=fs=>`<dl class="facts">${fs.map(([k,v])=>`<dt>${esc(k)}</dt><dd class="raw">${esc(v)}</dd>`).join('')}</dl>`;
 let web='<div class="muted">no web proxy</div>';
 if(w){const a=w.addr||w.listen,auth=w.webAuth||'',i=auth.indexOf(':');
  web=`<dl class="facts"><dt>Address</dt><dd class="raw">${esc(pageURL(a))}</dd><dt>Via</dt><dd class="raw">${esc(w.url)}</dd>
   <dt>User</dt><dd class="raw">${auth?esc(i<0?auth:auth.slice(0,i)):''}</dd><dt>Password</dt><dd>${auth?secret('wp:'+w.listen,i<0?'':auth.slice(i+1)):'<span class="muted">no login</span>'}</dd></dl>
   <div class="card-btns"><button class="primary" onclick="openPage(${js(a)},${js(auth)})">Open</button><button onclick="editLogin(${js(w.listen)},${js(auth)},'web page of server '+${js(name)})">Set login</button></div>`}
 return `<div class="card"><div class="card-head"><span class="card-ico">${svgIcon(FLOW_ICONS.server)}</span><div class="card-name"><b class="raw">${esc(name)}</b><div class="muted raw">${esc(addr)}</div></div><div class="card-state">${state}</div></div>
  ${facts.length?dl(facts):''}<div class="card-web"><h4>Management page</h4>${web}</div>${buttons?`<div class="card-btns end">${buttons}</div>`:''}</div>`}
const svgIcon=p=>`<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
let loginFor='';
function editLogin(listen,auth,what){loginFor=listen;const i=auth.indexOf(':');$('lgTitle').textContent='Login of the '+what;
 $('lgUser').value=i<0?auth:auth.slice(0,i);$('lgPass').value=i<0?'':auth.slice(i+1);loginEd.showModal()}
async function saveLogin(e){e.preventDefault();const u=$('lgUser').value.trim(),p=$('lgPass').value;
 if(await call('/api/webauth',{listen:loginFor,webAuth:u||p?u+':'+p:''},'Login saved'))loginEd.close()}
async function load(){try{state=await api('/api/status');render()}catch(e){toast(e.message,true)}}
const call=async(path,body,ok)=>{try{await api(path,body);toast(ok);load();return true}catch(e){toast(e.message,true);return false}};
async function addServer(e){e.preventDefault();if(await call('/api/servers',{name:$('sName').value.trim(),addr:$('sAddr').value.trim(),password:$('sPass').value,bodyPassword:$('sBody').value},'Server added'))e.target.reset()}
function delServer(name){if(confirm('Disconnect from '+name+'?'))call('/api/servers/delete',{name},'Removed')}
function refreshPods(server){call('/api/pods/refresh',{server},'Pods queried')}
function useNode(server,pod,node){wbShow('forwards');$('fServer').value=server;$('fPod').value=pod;$('fNode').value=node;$('fListen').focus()}
async function addForward(e){e.preventDefault();if(await call('/api/forwards',{listen:$('fListen').value.trim(),pod:$('fPod').value.trim(),node:$('fNode').value.trim(),server:$('fServer').value.trim(),webAuth:$('fWeb').value},'Forward added'))e.target.reset()}
function delForward(listen){call('/api/forwards/delete',{listen},'Forward removed')}
function closeTunnel(server,id){call('/api/tunnels/close',{server,id},'Tunnel closed')}
function saveMeta(e){e.preventDefault();const meta={};$('metaText').value.split(',').map(s=>s.trim()).filter(Boolean).forEach(kv=>{const i=kv.indexOf('=');if(i>0)meta[kv.slice(0,i).trim()]=kv.slice(i+1).trim()});call('/api/meta',meta,'Info sent to servers')}
function edit(server,pod){const s=state.servers.find(s=>s.name===server),p=s&&s.pods.find(p=>p.info.name===pod);if(!p)return;editing={server,pod};
 $('edTitle').textContent=`Nodes of pod ${pod} (via ${server})`;$('edRows').innerHTML='';(p.info.nodes||[]).forEach(n=>nodeRow($('edRows'),n));if(!(p.info.nodes||[]).length)nodeRow($('edRows'));editor.showModal()}
async function saveNodes(){if(await call('/api/pods/nodes',{...editing,nodes:readNodes($('edRows'))},'Nodes saved on the pod'))editor.close()}
load();setInterval(()=>{if(!editor.open&&!loginEd.open)load()},3000);
</script>
</body>
</html>
