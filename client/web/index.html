<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fibhub client</title>
<link rel="stylesheet" href="/static/base.css">
</head>
<body>
<header><h1>fibhub client <span id="name"></span></h1><span id="meta"></span></header>
<main>
<section><h2>Servers</h2><div id="servers"></div>
<form class="inline" onsubmit="addServer(event)">
<input id="sName" placeholder="name (optional)"><input id="sAddr" placeholder="host:7000 or ws://host:7001/fibhub" required><input id="sPass" type="password" placeholder="password" required><input id="sBody" type="password" placeholder="body AES password (optional)">
<button class="primary">Connect</button></form></section>
<section><h2>Pods and nodes</h2><div id="pods"></div></section>
<section><h2>Forwards</h2><div id="forwards"></div>
<form class="inline" onsubmit="addForward(event)">
<input id="fListen" placeholder="local address, 127.0.0.1:2222" required><input id="fPod" placeholder="pod" required><input id="fNode" placeholder="node" required>
<input id="fServer" placeholder="server (optional: any)"><button class="primary">Forward</button></form></section>
<section><h2>Tunnels</h2><div id="tunnels"></div></section>
<section><h2>Client info</h2>
<form class="inline" onsubmit="saveMeta(event)"><input id="metaText" placeholder="key=value, key2=value2 — told to servers"><button class="primary">Update servers</button></form></section>
</main>
<dialog id="editor">
<h3 id="edTitle">Nodes</h3>
<table><thead><tr><th>Name</th><th>Address (host:port)</th><th>Description</th><th></th></tr></thead><tbody id="edRows"></tbody></table>
<p><button onclick="nodeRow($('edRows'))">Add node</button></p>
<p style="text-align:right"><button onclick="editor.close()">Cancel</button> <button class="primary" onclick="saveNodes()">Save to pod</button></p>
</dialog>
<div id="msg"></div>
<script src="/static/base.js"></script>
<script>
let state={servers:[],forwards:[],tunnels:[]},metaLoaded=false,editing=null;
function render(){
 const st=state;$('name').textContent=st.name;$('meta').textContent=`v${st.version}${st.saved?'':' · settings not saved (no -config)'}`;
 if(!metaLoaded){$('metaText').value=Object.entries(st.meta||{}).map(([k,v])=>k+'='+v).join(', ');metaLoaded=true}
 $('servers').innerHTML=table(['Name','Address','State','Server','Peer ID','Pods','Tunnels',''],st.servers.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.addr)}</td>
  <td>${stateCell(s)}${s.bodyEncrypted?'<div class="muted">bodies encrypted</div>':''}</td><td>${esc(s.server)}</td><td>${s.peerId||''}</td><td>${s.pods.length}</td><td>${s.tunnels}</td>
  <td><button onclick="refreshPods(${js(s.name)})">Query pods</button><button class="danger" onclick="delServer(${js(s.name)})">Remove</button></td></tr>`));
 const rows=[];st.servers.forEach(s=>s.pods.forEach(p=>rows.push(`<tr><td>${esc(s.name)}</td><td>${esc(p.info.name)}<div class="muted">${esc(p.info.hostname)} ${esc(p.addr)}</div></td>
  <td>${(p.info.nodes||[]).map(n=>`<div class="node">${esc(n.name)} → ${esc(n.addr)}${n.desc?` <span class="muted">${esc(n.desc)}</span>`:''}
   <button onclick="useNode(${js(s.name)},${js(p.info.name)},${js(n.name)})">Forward…</button></div>`).join('')||'<span class="muted">none</span>'}</td>
  <td><button onclick="edit(${js(s.name)},${js(p.info.name)})">Edit nodes</button></td></tr>`)));
 $('pods').innerHTML=table(['Server','Pod','Nodes',''],rows);
 $('forwards').innerHTML=table(['Listen','Pod','Node','Server','State',''],st.forwards.map(f=>`<tr><td>${esc(f.addr||f.listen)}</td><td>${esc(f.pod)}</td><td>${esc(f.node)}</td>
  <td>${esc(f.server||'any')}</td><td>${f.error?`<span class="state-failed">${esc(f.error)}</span>`:'<span class="state-registered">listening</span>'}</td>
  <td><button class="danger" onclick="delForward(${js(f.listen)})">Remove</button></td></tr>`));
 $('tunnels').innerHTML=table(['Server','ID','Listen','Pod','Node','Address','Local client','Sent','Received','Age',''],st.tunnels.map(t=>`<tr><td>${esc(t.server)}</td><td>${t.id}</td><td>${esc(t.peer)}</td>
  <td>${esc(t.pod)}</td><td>${esc(t.node)}</td><td>${esc(t.addr)}</td><td>${esc(t.remote)}</td><td>${bytes(t.out)}</td><td>${bytes(t.in)}</td><td>${ago(t.created)}</td>
  <td><button class="danger" onclick="closeTunnel(${js(t.server)},${js(t.id)})">Close</button></td></tr>`));
}
async function load(){try{state=await api('/api/status');render()}catch(e){toast(e.message,true)}}
const call=async(path,body,ok)=>{try{await api(path,body);toast(ok);load();return true}catch(e){toast(e.message,true);return false}};
async function addServer(e){e.preventDefault();if(await call('/api/servers',{name:$('sName').value.trim(),addr:$('sAddr').value.trim(),password:$('sPass').value,bodyPassword:$('sBody').value},'Server added'))e.target.reset()}
function delServer(name){if(confirm('Disconnect from '+name+'?'))call('/api/servers/delete',{name},'Removed')}
function refreshPods(server){call('/api/pods/refresh',{server},'Pods queried')}
function useNode(server,pod,node){$('fServer').value=server;$('fPod').value=pod;$('fNode').value=node;$('fListen').focus()}
async function addForward(e){e.preventDefault();if(await call('/api/forwards',{listen:$('fListen').value.trim(),pod:$('fPod').value.trim(),node:$('fNode').value.trim(),server:$('fServer').value.trim()},'Forward added'))e.target.reset()}
function delForward(listen){call('/api/forwards/delete',{listen},'Forward removed')}
function closeTunnel(server,id){call('/api/tunnels/close',{server,id},'Tunnel closed')}
function saveMeta(e){e.preventDefault();const meta={};$('metaText').value.split(',').map(s=>s.trim()).filter(Boolean).forEach(kv=>{const i=kv.indexOf('=');if(i>0)meta[kv.slice(0,i).trim()]=kv.slice(i+1).trim()});call('/api/meta',meta,'Info sent to servers')}
function edit(server,pod){const s=state.servers.find(s=>s.name===server),p=s&&s.pods.find(p=>p.info.name===pod);if(!p)return;editing={server,pod};
 $('edTitle').textContent=`Nodes of pod ${pod} (via ${server})`;$('edRows').innerHTML='';(p.info.nodes||[]).forEach(n=>nodeRow($('edRows'),n));if(!(p.info.nodes||[]).length)nodeRow($('edRows'));editor.showModal()}
async function saveNodes(){if(await call('/api/pods/nodes',{...editing,nodes:readNodes($('edRows'))},'Nodes saved on the pod'))editor.close()}
load();setInterval(()=>{if(!editor.open)load()},3000);
</script>
</body>
</html>
